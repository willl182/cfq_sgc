<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sistema de formulación de fertilizantes CALFERQUIM S.A.S. — Cálculo de grado final, tolerancias ICA y gestión de fórmulas." />
    <title>Formulador CFQ — CALFERQUIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a472a'/><text x='16' y='22' font-size='16' font-weight='800' text-anchor='middle' fill='%2334d399'>C</text></svg>" />
  </head>
  <body>
    <a class="skip-link" href="#app-view">Ir al contenido</a>

    <div class="app-container">
      <!-- ── NAVBAR ─────────────────────────────────────────── -->
      <nav class="navbar" id="main-navbar" role="navigation" aria-label="Navegación principal">
        <div class="navbar__inner">
          <div class="navbar__brand">
            <div class="navbar__logo">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <rect width="28" height="28" rx="7" fill="url(#logo-grad)"/>
                <text x="14" y="19.5" font-size="14" font-weight="800" text-anchor="middle" fill="white" font-family="Inter, sans-serif">C</text>
                <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient></defs>
              </svg>
            </div>
            <div class="navbar__brand-text">
              <span class="navbar__title">Formulador<span class="navbar__title-accent">CFQ</span></span>
            </div>
          </div>

          <div class="navbar__tabs" role="tablist">
            <button class="navbar__tab navbar__tab--active" data-view="catalogo" role="tab" aria-selected="true" id="tab-catalogo">
              <svg class="navbar__tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="3" width="16" height="14" rx="2"/>
                <line x1="2" y1="7" x2="18" y2="7"/>
                <line x1="7" y1="7" x2="7" y2="17"/>
              </svg>
              <span>Catálogo de Insumos</span>
            </button>
            <button class="navbar__tab" data-view="formulador" role="tab" aria-selected="false" id="tab-formulador">
              <svg class="navbar__tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M7 2v4a1 1 0 01-1 1H3"/>
                <path d="M13 2v4a1 1 0 001 1h3"/>
                <path d="M7 7v9a2 2 0 002 2h2a2 2 0 002-2V7"/>
                <line x1="5" y1="12" x2="15" y2="12"/>
              </svg>
              <span>Formulador</span>
            </button>
            <button class="navbar__tab" data-view="formulas" role="tab" aria-selected="false" id="tab-formulas">
              <svg class="navbar__tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 4h12a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/>
                <path d="M7 8h6M7 11h4"/>
              </svg>
              <span>Fórmulas</span>
              <span class="navbar__tab-badge" id="formulas-badge" style="display:none">0</span>
            </button>
          </div>

          <div class="navbar__actions">
            <div class="navbar__status" id="api-status" title="Estado de conexión">
              <span class="navbar__status-dot"></span>
              <span class="navbar__status-text">Conectando...</span>
            </div>
          </div>
        </div>
      </nav>

      <!-- ── MAIN ───────────────────────────────────────────── -->
      <main class="main-content" id="main-content">
        <section id="app-view" class="view" role="tabpanel"></section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
